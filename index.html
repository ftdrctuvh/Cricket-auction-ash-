<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cricket Auction Ash</title><style>
*{box-sizing:border-box}html{min-height:100%}body{margin:0;min-height:100vh;color:#fff;font:16px system-ui;background:linear-gradient(180deg,rgba(2,17,20,.68),rgba(2,24,19,.80) 48%,rgba(0,18,14,.94)),radial-gradient(ellipse at 50% 95%,#69ba4c 0 12%,#348b3e 13% 29%,#175c35 30% 44%,#102d35 45% 65%,#07131e 66%);background-attachment:fixed}body:before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.34;background:repeating-radial-gradient(ellipse 85% 38% at 50% 100%,transparent 0 35px,rgba(214,255,190,.14) 37px 39px,transparent 41px 82px)}body:after{content:'🏟️  ·  🏏  ·  CRICKET AUCTION ASH  ·  🏏  ·  🏟️';position:fixed;bottom:0;left:0;right:0;text-align:center;padding:12px 4px;letter-spacing:2px;font-size:12px;background:#03150ecb;color:#c6edbb;pointer-events:none}main{position:relative;max-width:900px;margin:auto;padding:30px 18px 75px}h1{font-size:clamp(30px,6vw,48px);margin:12px 0;color:#ffe176;text-shadow:0 3px 16px #000,0 0 28px #ffc94766}main>p{font-weight:600;color:#e4ffdb;text-shadow:0 2px 8px #000}section{background:linear-gradient(135deg,rgba(5,37,31,.94),rgba(8,31,45,.92));border:1px solid #8aca7b80;box-shadow:0 14px 45px #0008, inset 0 1px #ffffff18;border-radius:22px;padding:24px;margin:22px 0;backdrop-filter:blur(8px)}button,input,select{padding:13px;border-radius:10px;border:0;font:inherit;margin:5px}button{background:linear-gradient(135deg,#ffdf72,#f6ad30);color:#182b20;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #9b6a19}button:hover{filter:brightness(1.08)}button:disabled{opacity:.4;cursor:not-allowed}input,select{background:#f2f8ee;color:#142d25;max-width:100%;border:1px solid #b6d9b2}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.card{background:linear-gradient(145deg,#184f3f,#153b46);border:1px solid #a0d78d55;padding:15px;border-radius:13px}.big{font-size:30px;font-weight:800;color:#ffdc70}.muted{color:#c9ddcf}#message{color:#ffdf72}h2,h3{color:#ffe176}#player .card{border-left:5px solid #ffcf54}#history p{padding:8px 12px;background:#ffffff0c;border-radius:8px}@media(max-width:550px){section{padding:16px}button{margin:5px 3px}#setup input,#setup select{width:100%;margin:5px 0}}
</style></head><body><main><h1>🏏 Cricket Auction Ash</h1><p>Build your dream cricket squad!</p><section id="setup"><input id="name" placeholder="Your name" maxlength="25"><select id="team"></select><div><button onclick="single()">Single Player</button><button onclick="create()">Create Multiplayer Room</button></div><input id="code" placeholder="Room code"><button onclick="join()">Join Room</button><p id="message"></p></section><section id="game" class="hidden"><h2 id="mode"></h2><p id="status"></p><div id="player"></div><div id="actions"></div><h3>Teams</h3><div class="grid" id="members"></div><h3>Auction history</h3><div id="history"></div></section></main><script src="/socket.io/socket.io.js"></script><script>
const teams=['CSK','MI','RCB','KKR','SRH','RR','DC','PBKS','GT','LSG'];const names=['Chennai Super Kings','Mumbai Indians','Royal Challengers Bengaluru','Kolkata Knight Riders','Sunrisers Hyderabad','Rajasthan Royals','Delhi Capitals','Punjab Kings','Gujarat Titans','Lucknow Super Giants'];team.innerHTML=teams.map((t,i)=>`<option value="${t}">${t} — ${names[i]}</option>`).join('');const pool=[['Virat Kohli',200],['MS Dhoni',150],['Rohit Sharma',200],['Jasprit Bumrah',200],['Shubman Gill',180],['Rashid Khan',180],['Suryakumar Yadav',180],['Ruturaj Gaikwad',160],['Hardik Pandya',170],['Rishabh Pant',180],['Sanju Samson',160],['KL Rahul',160],['Yashasvi Jaiswal',160],['Mohammed Siraj',130],['Ravindra Jadeja',160],['Travis Head',150],['Pat Cummins',170],['Andre Russell',140],['Sunil Narine',140],['Jos Buttler',160]].map(([name,base])=>({name,base}));let socket,room,local=false,interval,me;const $=id=>document.getElementById(id);function msg(s){$('message').textContent=s}function valid(){if(!$('name').value.trim()){msg('Enter your name first');return false}me=$('team').value;return true}function show(){setup.classList.add('hidden');game.classList.remove('hidden')}function connect(cb){if(typeof io==='undefined'){msg('Multiplayer needs the Node.js server. Run npm install and npm start.');return}socket=io();socket.on('state',r=>{room=r;render()});cb()};function create(){if(!valid())return;connect(()=>socket.emit('create',{name:$('name').value,team:me},res=>res.ok?show():msg(res.error)))}function join(){if(!valid())return;connect(()=>socket.emit('join',{code:$('code').value.trim(),name:$('name').value,team:me},res=>res.ok?show():msg(res.error)))}function single(){if(!valid())return;local=true;let others=teams.filter(t=>t!==me).slice(0,4);room={code:'SOLO',host:'you',members:[{name:$('name').value,team:me,purse:1000,squad:[]},...others.map(t=>({name:'Computer',team:t,purse:1000,squad:[]}))],started:true,index:0,current:null,remaining:10,history:[]};show();advance()}function advance(){clearInterval(interval);room.current=room.index<pool.length?{...pool[room.index],bid:0,leader:null}:null;room.remaining=10;render();if(!room.current)return;interval=setInterval(()=>{if(Math.random()<.26){let options=room.members.slice(1).filter(m=>m.purse>=(room.current.bid?room.current.bid+10:room.current.base)&&m.team!==room.current.leader);if(options.length){let m=options[Math.floor(Math.random()*options.length)];room.current.bid=room.current.bid?room.current.bid+10:room.current.base;room.current.leader=m.team;room.remaining=10}}room.remaining--;if(room.remaining<=0){let c=room.current,m=room.members.find(x=>x.team===c.leader);if(m){m.purse-=c.bid;m.squad.push(c.name)}room.history.unshift({name:c.name,team:c.leader||'UNSOLD',price:c.bid});room.index++;advance()}else render()},1000)}function bid(){if(local){let c=room.current,m=room.members[0],amount=c.bid?c.bid+10:c.base;if(m.purse>=amount&&c.leader!==me){c.bid=amount;c.leader=me;room.remaining=10;render()}}else socket.emit('bid')}function render(){if(!room)return;$('mode').textContent=local?'Single Player':`Multiplayer • Room ${room.code}`;$('status').textContent=room.started?`Player ${Math.min(room.index+1,pool.length)} of ${pool.length}`:`Waiting for teams (${room.members.length}/10). Share code ${room.code}`;let c=room.current;$('player').innerHTML=c?`<div class="card"><div class="big">${c.name}</div><p>Base ₹${c.base} lakh • Current ₹${c.bid||0} lakh</p><p>Leading: ${c.leader||'No bids yet'} • ⏱ ${room.remaining}s</p></div>`:room.started?'<h2>Auction complete! 🏆</h2>':'<p>At least two teams are needed.</p>';$('actions').innerHTML=!room.started?(!local&&room.host===socket.id?'<button onclick="socket.emit(\'start\')" '+(room.members.length<2?'disabled':'')+'>Start Auction</button>':'Waiting for host to start...'):c?'<button onclick="bid()" '+(c.leader===me||room.members.find(m=>m.team===me)?.purse<(c.bid?c.bid+10:c.base)?'disabled':'')+'>Bid ₹'+(c.bid?c.bid+10:c.base)+' lakh</button>':'';$('members').innerHTML=room.members.map(m=>`<div class="card"><b>${m.team}</b> — ${m.name}<p>₹${m.purse} lakh remaining</p><small>${m.squad.join(', ')||'No players yet'}</small></div>`).join('');$('history').innerHTML=room.history.map(h=>`<p>${h.name} — ${h.team}${h.team==='UNSOLD'?'':` (₹${h.price} lakh)`}</p>`).join('')||'<p class="muted">No completed bids yet</p>'}
</script></body></html>
